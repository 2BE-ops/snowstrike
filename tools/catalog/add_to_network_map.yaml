apiVersion: snowstrike/v1
kind: Tool
metadata:
  name: add_to_network_map
  category: shared
  requires_root: false
  passive: false
spec:
  description: >-
    Add a host, port, or service to the shared network map. All agents can read the
    network map to understand the target environment.
  input_schema:
    type: object
    properties:
      host:
        type: string
        description: IP address or hostname.
      ports:
        type: array
        items:
          type: object
          properties:
            port:
              type: integer
              description: Port number.
            protocol:
              type: string
              enum:
              - tcp
              - udp
              description: Protocol.
            state:
              type: string
              enum:
              - open
              - closed
              - filtered
              description: Port state.
            service:
              type: string
              description: Service name (e.g., 'http', 'ssh').
            version:
              type: string
              description: Service version string.
            banner:
              type: string
              description: Service banner if captured.
          required:
          - port
          - protocol
          - state
        description: List of port entries for this host.
      os_guess:
        type: string
        description: Operating system guess for this host.
      hostnames:
        type: array
        items:
          type: string
        description: Known hostnames or DNS names for this host.
      tags:
        type: array
        items:
          type: string
        description: Tags like 'domain_controller', 'web_server', 'database'.
    required:
    - host
  compatible_agents:
  - all
