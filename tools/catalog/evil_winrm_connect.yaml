apiVersion: snowstrike/v1
kind: Tool
metadata:
  name: evil_winrm_connect
  category: exploitation
  requires_root: false
  binary: evil-winrm
  passive: false
spec:
  flag_map:
  - param: target
    flag: -i
  - param: username
    flag: -u
  - param: password
    flag: -p
  - param: hash
    flag: -H
  - param: key
    flag: -k
  - param: port
    flag: -P
  - param: ssl
    flag: -S
    transform: bool
  - param: scripts
    flag: -s
  - param: command
    flag: -c
  compatible_agents:
  - attack
  description: Connect to a Windows host via WinRM using Evil-WinRM. Supports password,
    hash, and key-based auth.
  input_schema:
    type: object
    properties:
      target:
        type: string
        description: Target IP or hostname.
      username:
        type: string
        description: Username for authentication.
      password:
        type: string
        description: Password for authentication.
      hash:
        type: string
        description: NTLM hash for pass-the-hash.
      key:
        type: string
        description: Path to private key file.
      port:
        type: integer
        description: 'WinRM port. Default: 5985.'
      ssl:
        type: boolean
        description: Use SSL (port 5986).
      command:
        type: string
        description: Command to execute on the remote host.
      scripts:
        type: string
        description: Path to PowerShell scripts directory.
      extra_args:
        type: string
        description: Additional evil-winrm arguments.
    required:
    - target
    - username
