apiVersion: snowstrike/v1
kind: Tool
metadata:
  name: ghidra_get_xrefs_to
  category: cross_refs
  requires_root: false
  passive: false
  transport: http
  endpoint: /get_xrefs_to
  http_method: GET
spec:
  description: >-
    Get all cross-references TO an address. Shows every location in the binary that
    references this address.
  input_schema:
    type: object
    properties:
      address:
        type: string
        description: Target address in hex (e.g., '0x401000').
    required:
    - address
  compatible_agents:
  - ghidra
