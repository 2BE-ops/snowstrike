apiVersion: snowstrike/v1
kind: Tool
metadata:
  name: spiderfoot_scan
  category: osint
  requires_root: false
  binary: spiderfoot
  passive: false
spec:
  flag_map:
  - param: target
    flag: -s
  - param: modules
    flag: -m
  - param: scan_name
    flag: -n
  compatible_agents:
  - osint
  description: OSINT automation framework using SpiderFoot. Gathers intelligence from
    multiple data sources about targets.
  input_schema:
    type: object
    properties:
      target:
        type: string
        description: Target to investigate (IP, domain, email, username, etc.).
      modules:
        type: string
        description: Comma-separated list of modules to enable.
      scan_name:
        type: string
        description: Name for this scan.
      extra_args:
        type: string
        description: Additional SpiderFoot arguments.
    required:
    - target
