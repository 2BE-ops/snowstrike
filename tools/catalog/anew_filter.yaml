apiVersion: snowstrike/v1
kind: Tool
metadata:
  name: anew_filter
  category: utility
  requires_root: false
  binary: anew
  passive: true
spec:
  flag_map:
  - param: quiet
    flag: -q
    transform: bool
  - param: output_file
    flag: null
  compatible_agents:
  - webapp
  description: Append new unique lines to a file using anew. Deduplicates input against
    existing file contents.
  input_schema:
    type: object
    properties:
      input_file:
        type: string
        description: Input file to read lines from.
      output_file:
        type: string
        description: Output file to append unique lines to.
      quiet:
        type: boolean
        description: Quiet mode - do not print new lines to stdout.
    required:
    - input_file
    - output_file
