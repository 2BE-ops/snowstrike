apiVersion: snowstrike/v1
kind: Tool
metadata:
  name: ghidra_disassemble_function
  category: data_analysis
  requires_root: false
  passive: false
  transport: http
  endpoint: /disassemble_function
  http_method: GET
spec:
  description: >-
    Get raw disassembly listing for a function. Use when decompiled C is insufficient
    and you need actual instructions.
  input_schema:
    type: object
    properties:
      name:
        type: string
        description: Function name.
      address:
        type: string
        description: Function address in hex.
    required: []
  compatible_agents:
  - ghidra
