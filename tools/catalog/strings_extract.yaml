apiVersion: snowstrike/v1
kind: Tool
metadata:
  name: strings_extract
  category: binary_analysis
  binary: strings
  requires_root: false
  passive: false
spec:
  description: Extract printable strings from a binary file.
  input_schema:
    type: object
    properties:
      file:
        type: string
        description: Path to binary file.
      min_length:
        type: integer
        description: 'Minimum string length. Default: 4.'
      encoding:
        type: string
        enum:
        - s
        - S
        - b
        - l
        - B
        - L
        description: Character encoding (s=7-bit, S=8-bit, b/l=16-bit, B/L=32-bit).
      offset:
        type: boolean
        description: Print offset of each string.
      extra_args:
        type: string
        description: Additional strings arguments.
    required:
    - file
  compatible_agents:
  - binary
