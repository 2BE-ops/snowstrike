apiVersion: snowstrike/v1
kind: Tool
metadata:
  name: request_credentialed_execution
  category: shared
  requires_root: false
  passive: false
spec:
  description: >-
    Request operator-side execution of a tool requiring operator-held credentials.
    Credentials are injected by the operator via the TUI and never visible to agents.
    The command_template must use {CREDENTIAL} as a placeholder.
  input_schema:
    type: object
    properties:
      tool_name:
        type: string
        description: Name of the tool to execute (e.g., 'nuclei', 'shodan').
      command_template:
        type: string
        description: >-
          Command string with {CREDENTIAL} placeholder where the operator-held credential
          should be injected.
      context:
        type: string
        description: Why this credentialed execution is needed.
    required:
    - tool_name
    - command_template
    - context
  compatible_agents:
  - all
