apiVersion: snowstrike/v1
kind: Tool
metadata:
  name: hashcat_crack
  category: credential_cracking
  requires_root: false
  binary: hashcat
  passive: false
spec:
  flag_map:
  - param: hash_type
    flag: -m
  - param: attack_mode
    flag: -a
  - param: rules_file
    flag: -r
  - param: force
    flag: --force
    transform: bool
  - param: show
    flag: --show
    transform: bool
  - param: hash_file
    flag: null
  - param: wordlist
    flag: null
  - param: mask
    flag: null
  compatible_agents:
  - attack
  description: Advanced GPU-based password cracker using Hashcat. Supports hundreds
    of hash types and attack modes.
  input_schema:
    type: object
    properties:
      hash_file:
        type: string
        description: Path to file containing hashes.
      hash_type:
        type: integer
        description: Hashcat hash type code (e.g., 0=MD5, 1000=NTLM, 1800=SHA-512).
      attack_mode:
        type: integer
        enum:
        - 0
        - 1
        - 3
        - 6
        - 7
        description: 'Attack mode: 0=Dictionary, 1=Combinator, 3=Brute-force, 6=Hybrid
          Dict+Mask, 7=Hybrid Mask+Dict.'
      wordlist:
        type: string
        description: Path to wordlist file (for dictionary/hybrid attacks).
      mask:
        type: string
        description: Mask pattern for brute-force (e.g., '?a?a?a?a?a?a?a?a').
      rules_file:
        type: string
        description: Path to rules file.
      force:
        type: boolean
        description: Ignore warnings and force execution.
      show:
        type: boolean
        description: Show cracked hashes.
      extra_args:
        type: string
        description: Additional hashcat arguments.
    required:
    - hash_file
    - hash_type
