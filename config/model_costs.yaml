# SnowStrike AI - Model Cost & Capability Matrix
# Updated: 2026-04-07
# Prices in USD per million tokens
#
# Sources:
#   Anthropic: https://platform.claude.com/docs/en/about-claude/pricing
#   OpenAI:    https://openai.com/api/pricing/
#   Moonshot:  https://platform.moonshot.ai/docs/pricing/chat

models:
  # =========================================================================
  # Anthropic — Claude
  # =========================================================================
  claude-opus-4-6:
    label: "Claude Opus 4.6"
    provider: anthropic
    api_key_env: ANTHROPIC_API_KEY
    input_cost_per_mtok: 5.00
    output_cost_per_mtok: 25.00
    context_window: 1000000
    thinking_capability: "full"
    tier: "premium"
    recommended_roles:
      - orchestrator
      - attack
      - reporting
    notes: "Most capable Anthropic model. Best for strategic planning and complex exploitation chains."

  claude-sonnet-4-6:
    label: "Claude Sonnet 4.6"
    provider: anthropic
    api_key_env: ANTHROPIC_API_KEY
    input_cost_per_mtok: 3.00
    output_cost_per_mtok: 15.00
    context_window: 1000000
    thinking_capability: "good"
    tier: "balanced"
    recommended_roles:
      - recon
      - webapp
      - attack
      - cloud
      - binary
      - reporting
    notes: "Best balance of capability and cost. Default tool-calling tier."

  claude-haiku-4-5:
    label: "Claude Haiku 4.5"
    provider: anthropic
    api_key_env: ANTHROPIC_API_KEY
