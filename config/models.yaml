# SnowStrike AI — Model Registry
# Defines available LLM models, their providers, and tier presets.

models:
  # --- Anthropic ---
  claude-sonnet-4-20250514:
    label: "Claude Sonnet 4"
    provider: anthropic
    api_key_env: ANTHROPIC_API_KEY
  claude-opus-4-20250514:
    label: "Claude Opus 4"
    provider: anthropic
    api_key_env: ANTHROPIC_API_KEY
  claude-haiku-4-5-20251001:
