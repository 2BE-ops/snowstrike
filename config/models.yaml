  o4-mini:
    label: "o4-mini"
    provider: openai
    base_url: "https://api.openai.com/v1"
    api_key_env: OPENAI_API_KEY
  o3:
    label: "o3"
    provider: openai
    base_url: "https://api.openai.com/v1"
    api_key_env: OPENAI_API_KEY

  # --- xAI / Grok ---
  grok-4:
    label: "Grok 4"
