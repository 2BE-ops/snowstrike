  # --- Kimi / Moonshot AI ---
  kimi-k2-0711-preview:
    label: "Kimi K2"
    provider: openai
    base_url: "https://api.moonshot.ai/v1"
    api_key_env: MOONSHOT_API_KEY
  kimi-k2.5:
    label: "Kimi K2.5"
